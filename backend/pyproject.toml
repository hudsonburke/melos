[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "melos-backend"
version = "0.1.0"
description = "Python backend server for the Melos design editor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "melos-core",
    "melos-rerun",
    "rerun-importer-osim",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/melos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
