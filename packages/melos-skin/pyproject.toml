[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "melos-skin"
version = "0.1.0"
description = "Skinned human model providers for the melos ecosystem"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["melos-core>=0.1.0", "numpy>=2.0"]
keywords = ["biomechanics", "skin", "mhr", "human-model", "melos"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
mhr = ["py-soma-x"]

[tool.uv.sources]
melos-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/melos"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src", "../melos-core/src", "../melos-sim/src", "../melos-blender/src"]
pythonVersion = "3.12"
