[project]
name = "melos"
version = "0.1.0"
description = "Musculoskeletal modeling and cable-driven exoskeleton design framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "melos-core",
    "melos-sim",
]

[project.optional-dependencies]
mujoco = ["mujoco>=3.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyright>=1.1",
]
all = [
    "melos-core",
    "melos-sim",
    "melos-skin",
    "melos-blender",
    "melos-rerun",
    "melos-backend",
]

[tool.uv.workspace]
members = [
    "packages/melos-core",
    "packages/melos-blender",
    "packages/melos-sim",
    "packages/melos-skin",
    "packages/melos-rerun",
    "backend",
]

[tool.uv.sources]
melos-core = { workspace = true }
melos-sim = { workspace = true }
melos-skin = { workspace = true }
melos-blender = { workspace = true }
melos-rerun = { workspace = true }
melos-backend = { workspace = true }
rerun-importer-osim = { git = "https://github.com/hudsonburke/rerun-importer-osim.git" }

[tool.pytest.ini_options]
testpaths = [
    "packages/melos-core/tests",
    "packages/melos-sim",
    "packages/melos-skin/tests",
    "packages/melos-rerun/tests",
]
